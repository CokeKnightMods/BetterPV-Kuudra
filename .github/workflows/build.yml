name: Build Minecraft 26.1.2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :26.1.2:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BetterPV-Kuudra-26.1.2
          path: versions/26.1.2/build/libs/*.jar
          if-no-files-found: error
